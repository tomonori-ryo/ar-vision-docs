<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARペースセッター 開発プロジェクト</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon.png">
<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root{
    --paper: #F6F4EF;
    --paper-raised: #FFFFFF;
    --ink: #1C2027;
    --ink-soft: #545B68;
    --line: #DBD7CC;
    --accent: #2456A6;
    --accent-soft: #E7EDF7;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  #siteGate{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  body.is-unlocked #siteGate{ display:none; }
  .gate-card{
    width:100%;
    max-width:360px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:28px 24px;
  }
  .gate-brand{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:20px;
  }
  .gate-brand img{
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#1c1c1c;
  }
  .gate-brand h1{
    margin:0;
    font-size:18px;
    line-height:1.3;
  }
  .gate-card label{
    display:block;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  .gate-card input[type="password"]{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:4px;
    font-size:15px;
    margin-bottom:12px;
  }
  .gate-card button{
    width:100%;
    padding:10px 12px;
    border:none;
    border-radius:4px;
    background:var(--accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .gate-card button:hover{ filter:brightness(0.95); }
  .gate-error{
    display:none;
    color:#b42318;
    font-size:13px;
    margin:0 0 12px;
  }
  .gate-error.is-visible{ display:block; }

  #app{
    display:none;
    max-width:960px;
    margin:0 auto;
    padding:0 24px 80px;
  }
  body.is-unlocked #app{ display:block; }

  header{
    padding:48px 0 24px;
    border-bottom:1px solid var(--line);
  }
  .header-bar{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
  }
  .brand{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:0;
    flex:1;
  }
  .brand-title-row{
    display:flex;
    align-items:center;
    gap:12px;
  }

  /* サイト外側の入口（ドキュメントタブとは別） */
  .site-menu{
    position:relative;
    flex:0 0 auto;
    margin-top:2px;
  }
  .site-menu-btn{
    width:40px;
    height:40px;
    padding:0;
    border:1px solid var(--line);
    border-radius:4px;
    background:var(--paper-raised);
    color:var(--ink);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .site-menu-btn:hover{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .site-menu-btn[aria-expanded="true"]{
    border-color:var(--accent);
    background:var(--accent);
    color:#fff;
  }
  .site-menu-btn:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  .site-menu-icon{
    display:block;
    width:18px;
    height:12px;
    position:relative;
  }
  .site-menu-icon::before,
  .site-menu-icon::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    height:2px;
    border-radius:1px;
    background:currentColor;
  }
  .site-menu-icon span{
    position:absolute;
    left:0;
    right:0;
    top:5px;
    height:2px;
    border-radius:1px;
    background:currentColor;
  }
  .site-menu-icon::before{ top:0; }
  .site-menu-icon::after{ bottom:0; }
  .site-menu-panel{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    z-index:40;
    min-width:200px;
    padding:6px;
    background:#1C2027;
    border:1px solid #2e3440;
    border-radius:6px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18);
  }
  .site-menu-panel[hidden]{ display:none; }
  .site-menu-panel a{
    display:block;
    padding:10px 12px;
    border-radius:4px;
    color:#F6F4EF;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
  }
  .site-menu-panel a:hover{
    background:var(--accent);
    color:#fff;
  }
  .site-menu-panel a:focus-visible{
    outline:2px solid #8eb0e8;
    outline-offset:1px;
  }
  .brand-logo{
    flex:0 0 auto;
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:1px solid var(--line);
    background:#1c1c1c;
  }
  .brand-title-row h1{
    font-size:28px;
    font-weight:700;
    margin:0;
    letter-spacing:0.01em;
    line-height:1.2;
  }
  header p{
    margin:0;
    padding-left:52px;
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.6;
  }

  .nav-stack{
    background:var(--paper);
    border-bottom:1px solid var(--line);
  }

  nav.tab-row{
    display:flex;
    gap:4px;
    overflow-x:auto;
  }
  nav#docTabs{ padding:16px 0 8px; }
  nav#catTabs{
    padding:0 0 8px;
    display:none;
  }
  nav#catTabs.is-visible{ display:flex; }
  nav#revTabs{ padding:0 0 16px; }

  nav button{
    flex:0 0 auto;
    border:1px solid transparent;
    background:none;
    color:var(--ink-soft);
    padding:6px 12px;
    border-radius:4px;
    cursor:pointer;
  }
  nav#docTabs button{
    font-size:14px;
    font-weight:600;
  }
  nav#catTabs button{
    font-size:13px;
    font-weight:600;
  }
  nav#revTabs button{
    font-size:13px;
    font-family:var(--mono);
  }
  nav button:hover{
    background:var(--accent-soft);
    color:var(--ink);
  }
  nav#docTabs button.active{
    background:var(--accent);
    color:#fff;
  }
  nav#catTabs button.active{
    border-color:var(--accent);
    color:var(--accent);
    background:var(--accent-soft);
  }
  nav#revTabs button.active{
    border-color:var(--accent);
    color:var(--accent);
    background:var(--accent-soft);
  }
  nav#revTabs button.latest::after{
    content:" ・最新";
  }

  main{ padding-top:32px; }
  .slide{ display:none; }
  .slide.active{ display:block; }

  .slide-meta{
    display:flex;
    flex-wrap:wrap;
    align-items:baseline;
    gap:12px;
    margin-bottom:8px;
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-soft);
  }
  .slide > h2{
    font-size:24px;
    margin:0 0 12px;
  }
  .slide .summary{
    background:var(--accent-soft);
    border-left:3px solid var(--accent);
    padding:14px 16px;
    font-size:14px;
    line-height:1.8;
    margin-bottom:32px;
    color:var(--ink);
  }

  .section{
    padding:28px 0 28px 1.25em;
    border-top:1px solid var(--line);
  }
  .section:first-of-type{ border-top:none; }
  .section .body{
    font-size:15px;
    line-height:1.9;
    color:var(--ink);
    white-space:pre-wrap;
  }
  .section img,
  .md-body img{
    cursor:zoom-in;
  }
  .section img{
    display:block;
    max-width:100%;
    height:auto;
    margin-top:16px;
    border:1px solid var(--line);
    border-radius:2px;
  }

  .md-body{
    font-size:15px;
    line-height:1.9;
    color:var(--ink);
    padding-left:1.25em;
  }
  .md-body > :first-child{ margin-top:0; }
  .md-body h1{
    font-size:26px;
    margin:0 0 16px;
    line-height:1.35;
  }
  .md-body h2{
    font-size:20px;
    margin:36px 0 12px;
    padding:10px 0 10px 14px;
    border-left:3px solid var(--accent);
  }
  .md-body h3{
    font-size:17px;
    margin:28px 0 10px;
    padding:6px 0 6px 14px;
    border-left:3px solid var(--accent);
  }
  .md-body h4,
  .md-body h5{
    font-size:15px;
    margin:22px 0 8px;
    padding-left:14px;
    border-left:2px solid color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .section h3{
    font-size:16px;
    margin:0 0 12px;
    padding:6px 0 6px 14px;
    border-left:3px solid var(--accent);
  }

  .md-body :is(h1,h2,h3,h4,h5),
  .section h3,
  .md-body a[id^="screen-"],
  .md-body a[id^="detail-"],
  .md-body a#features{
    position:relative;
    scroll-margin-top:72px;
  }
  .heading-anchor{
    position:absolute;
    left:-1.15em;
    top:0;
    width:1em;
    color:var(--accent);
    text-decoration:none;
    font-weight:600;
    opacity:0;
    transition:opacity .15s ease;
  }
  .md-body :is(h1,h2,h3,h4,h5):hover .heading-anchor,
  .md-body :is(h1,h2,h3,h4,h5):focus-within .heading-anchor,
  .section h3:hover .heading-anchor,
  .section h3:focus-within .heading-anchor,
  .heading-anchor:focus-visible{
    opacity:1;
  }
  .heading-anchor:hover,
  .heading-anchor:focus-visible{
    color:var(--ink);
  }
  @media (max-width:600px){
    .heading-anchor{
      position:static;
      display:inline-block;
      margin-right:0.35em;
      opacity:0.45;
      width:auto;
      left:auto;
    }
  }
  .md-body p{ margin:0 0 14px; }
  .md-body ul,
  .md-body ol{
    margin:0 0 16px;
    padding-left:1.4em;
  }
  .md-body li{ margin:0.25em 0; }
  .md-body blockquote{
    margin:0 0 16px;
    padding:12px 16px;
    border-left:3px solid var(--accent);
    background:var(--accent-soft);
    color:var(--ink);
  }
  .md-body blockquote p{ margin:0 0 8px; }
  .md-body blockquote p:last-child{ margin-bottom:0; }
  .md-body table{
    width:100%;
    border-collapse:collapse;
    margin:0 0 20px;
    font-size:14px;
  }
  .md-body th,
  .md-body td{
    border:1px solid var(--line);
    padding:10px 12px;
    vertical-align:top;
    text-align:left;
  }
  .md-body th{
    background:var(--accent-soft);
    font-weight:600;
  }
  .md-body img{
    display:block;
    max-width:100%;
    height:auto;
    margin:16px auto;
    border:1px solid var(--line);
    border-radius:2px;
  }
  .md-body img[src*="assets/screens/"]{
    max-width:min(180px, 36%);
  }
  .md-body img[src*="ar-hud-mock"],
  .md-body img[src*="ar-core-pipeline"],
  .md-body img[src*="ar-gaze-vs-travel"],
  .md-body img[src*="ar-floor-latch"]{
    max-width:min(720px, 96%);
  }
  .md-body a{ color:var(--accent); }
  .md-body a[href^="#doc-"],
  .md-body a[href^="#nav:"]{
    cursor:pointer;
    text-decoration:underline;
  }
  .md-body hr{
    border:none;
    border-top:1px solid var(--line);
    margin:28px 0;
  }
  .md-body code{
    font-family:var(--mono);
    font-size:0.92em;
    background:rgba(0,0,0,0.05);
    padding:0.1em 0.35em;
    border-radius:3px;
  }
  .md-status{
    color:var(--ink-soft);
    font-size:14px;
    padding:24px 0;
  }
  .md-status.error{ color:#8B2E2E; }

  #imgLightbox{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:rgba(28, 32, 39, 0.88);
    cursor:zoom-out;
  }
  #imgLightbox.is-open{ display:flex; }
  #imgLightbox img{
    max-width:min(96vw, 1200px);
    max-height:92vh;
    width:auto;
    height:auto;
    border-radius:4px;
    box-shadow:0 8px 32px rgba(0,0,0,0.35);
    cursor:default;
  }
  #imgLightboxClose{
    position:absolute;
    top:16px;
    right:16px;
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,0.92);
    color:var(--ink);
    font-size:24px;
    line-height:1;
    cursor:pointer;
  }
  #imgLightboxClose:hover{ background:#fff; }
  body.img-lightbox-open{ overflow:hidden; }

  .arrows{
    position:fixed;
    bottom:24px;
    right:24px;
    display:flex;
    gap:8px;
  }
  .arrows button{
    width:44px;
    height:44px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--ink);
    font-size:18px;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
  }
  .arrows button:hover{
    border-color:var(--accent);
    color:var(--accent);
  }
  .arrows button:disabled{
    opacity:0.3;
    cursor:default;
  }
  .arrows button:focus-visible,
  nav button:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }

  @media (max-width:600px){
    header{ padding:32px 0 20px; }
    .header-bar{ gap:10px; }
    .brand-title-row{ gap:10px; }
    .brand-logo{ width:32px; height:32px; }
    .brand-title-row h1{ font-size:22px; }
    header p{ padding-left:42px; }
    .site-menu-btn{ width:36px; height:36px; }
    .slide > h2{ font-size:20px; }
    .md-body h1{ font-size:22px; }
    .arrows{ right:16px; bottom:16px; }
  }
</style>
</head>
<body>

<div id="siteGate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
  <form class="gate-card" id="siteGateForm">
    <div class="gate-brand">
      <img src="assets/logo-icon.png" width="40" height="40" alt="">
      <h1 id="gateTitle">ARペースセッター<br>ドキュメント</h1>
    </div>
    <label for="siteGatePassword">パスワード</label>
    <input id="siteGatePassword" type="password" autocomplete="current-password" required>
    <p class="gate-error" id="siteGateError">パスワードが違います</p>
    <button type="submit">入室する</button>
  </form>
</div>

<div id="app">
  <header>
    <div class="header-bar">
      <div class="brand">
        <div class="brand-title-row">
          <img class="brand-logo" src="assets/logo-icon.png" width="40" height="40" alt="AR Vision ロゴ">

        <p>大分類 →（種別）→ バージョンの順に切り替えて閲覧できます。要件定義書・基本設計書のみ種別タブ（スマホアプリ / ARグラス）があります。最新版には「最新」の表示があります。</p>

      <!-- サイト外側の入口（企画書〜基本設計書のタブとは別） -->

        <button

          <span class="site-menu-icon" aria-hidden="true"><span></span></span>

          <!-- TODO: URLを入れる — スケジュール表 -->
          <a href="https://app.notion.com/p/216327e5a92b807d8bfae7c79cde3b9a?v=216327e5a92b818f937f000cfe9647ab" target="_blank" rel="noopener noreferrer">スケジュール表</a>
          <!-- TODO: URLを入れる — 課題管理表 -->

          <!-- TODO: URLを入れる — 作業報告 -->

          <!-- TODO: URLを入れる — 週報 -->
          
          <a href="https://forms.gle/wmA8UWkMYd2gfjdn7" target="_blank" rel="noopener noreferrer">週報</a>

          <a href="https://docs.google.com/spreadsheets/d/1t_JTAgfYmbMfPdqOAnOixhChZpOjZVBRZ7TrzK8q118/edit?gid=438009994#gid=438009994" target="_blank" rel="noopener noreferrer">結合テストリスト</a>

      </div>
    </div>
  </header>

  <div class="nav-stack">
    <nav id="docTabs" class="tab-row" aria-label="大分類"></nav>
    <nav id="catTabs" class="tab-row" aria-label="種別"></nav>
    <nav id="revTabs" class="tab-row" aria-label="バージョン"></nav>
  </div>
  <main id="slides"></main>

  <div class="arrows">
    <button id="prevBtn" aria-label="前のバージョン">←</button>
    <button id="nextBtn" aria-label="次のバージョン">→</button>

</div>

<div id="imgLightbox" hidden aria-hidden="true">
  <button id="imgLightboxClose" type="button" aria-label="拡大表示を閉じる">×</button>
  <img id="imgLightboxImg" alt="">
</div>

<script>
(function(){
  const PASS_HASH = '54d4aef4257f7791bfe2a1900e485a156a28a84281e21910ae943088c816fc1b';
  const KEY = 'ar-docs-auth-v1';
  const form = document.getElementById('siteGateForm');
  const input = document.getElementById('siteGatePassword');
  const error = document.getElementById('siteGateError');

  async function sha256(text){
    const data = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }

  function unlock(){
    document.body.classList.add('is-unlocked');
    try{ sessionStorage.setItem(KEY, '1'); } catch(_){}
  }

  try{
    if (sessionStorage.getItem(KEY) === '1') unlock();
  } catch(_){}

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    error.classList.remove('is-visible');
    const hash = await sha256(input.value || '');
    if (hash === PASS_HASH){
      unlock();
      return;
    }
    error.classList.add('is-visible');
    input.select();
  });

  if (!document.body.classList.contains('is-unlocked')){
    setTimeout(() => input.focus(), 0);
  }
})();
</script>
<script>
(function(){
  const root = document.getElementById('siteMenu');
  const btn = document.getElementById('siteMenuBtn');
  const panel = document.getElementById('siteMenuPanel');
  if (!root || !btn || !panel) return;

  function setOpen(open){
    panel.hidden = !open;
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'サイトメニューを閉じる' : 'サイトメニューを開く');
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    setOpen(panel.hidden);
  });

  document.addEventListener('click', (e) => {
    if (panel.hidden) return;
    if (!root.contains(e.target)) setOpen(false);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !panel.hidden){
      setOpen(false);
      btn.focus();
    }
  });
})();
</script>

<script>
/* =========================================================
   編集するのは DOCS だけです。

   大分類:
   {
     hasCategory: false,
     versions: [ { version, date, title, summary, sections|markdown } ]
   }
   または
   {
     hasCategory: true,
     categories: {
       "スマホアプリ": { versions: [...] },
       "ARグラス": { versions: [...] }
     }
   }

   バージョン1件:
   - sections: [{ heading, body, image }]  … 従来どおり
   - markdown: "企画書.md"                 … Markdownファイル読込（任意）
   ========================================================= */

const DOCS = {
  "企画書": {
    hasCategory: false,
    versions: [
      {
        version: "v1",
        date: "2026-09-02",
        title: "AR Vision 企画書",
        summary: "次世代ARランニング支援システム「AR Vision」の企画書（チームA / KANNAGI）。",
        markdown: "企画書.md"
      }
    ]
  },

  "調査書": {
    hasCategory: false,
    versions: [
      {
        version: "v1",
        date: "2026-09-02",
        title: "AR Vision 調査報告書",
        summary: "生理学的根拠・市場転換点・競合分析をまとめた調査報告書。",
        markdown: "調査書.md"
      }
    ]
  },

  "要件定義書": {
    hasCategory: true,
    categories: {
      "スマホアプリ": {
        versions: [
          {
            version: "v1",
            date: "2026-09-04",
            title: "スマホアプリ側 要件定義書",
            summary: "実装フロー図照合済み。画面遷移順のUI要件と、初回のみ／ラン開始時毎回の分岐を整理したウォーターフォール初版。",
            markdown: "要件定義書_スマホアプリ.md"
          }
        ]
      },
      "ARグラス": {
        versions: [
          {
            version: "v1",
            date: "2026-09-04",
            title: "ARグラス側 要件定義書",
            summary: "ARグラス側の体験・表示要件。HUD項目ON/OFFはスマホアプリ設定に従う。アジャイル初版。",
            markdown: "要件定義書_ARグラス.md"
          }
        ]
      }
    }
  },

  "基本設計書": {
    hasCategory: true,
    categories: {
      "スマホアプリ": {
        versions: [
          {
            version: "v1",
            date: "2026-09-04",
            title: "スマホアプリ側 基本設計書",
            summary: "画面遷移図準拠。S5の時間・距離・ペース自動計算ロジックを含む基本設計初版。",
            markdown: "スマホアプリ側_基本設計書_v1.md"
          },
          {
            version: "v2",
            date: "2026-09-05",
            title: "スマホアプリ側 基本設計書",
            summary: "確定版。先頭の機能一覧から各画面詳細へジャンプ可能。S8ルート提案・S7ラン結果・S5自動計算ロジックを反映。",
            markdown: "スマホアプリ側_基本設計書_v2.md"
          }
        ]
      },
      "ARグラス": {
        versions: [
          {
            version: "v1",
            date: "2026-09-04",
            title: "ARグラス側 基本設計書",
            summary: "要件定義書（ARグラス側）の機能を、Unity（C#）＋ARKitの構成でどう実現するかの粗い役割分担。アジャイル初版。",
            markdown: "ARグラス側_基本設計書_v1.md"
          },
          {
            version: "v2",
            date: "2026-09-10",
            title: "ARグラス側 基本設計書",
            summary: "v1を引き継ぎ、モック画像をもとにAR HUDレイアウトとアバター表現（半透明＋シェブロン軌跡）を具体化。",
            markdown: "ARグラス側_基本設計書_v2.md"
          },
          {
            version: "v3",
            date: "2026-09-10",
            title: "ARグラス側 基本設計書",
            summary: "UaaL統合アーキテクチャとアバター挙動のコア処理（自己位置・進行方向・相対距離・描画制御、工夫①②）を反映。",
            markdown: "ARグラス側_基本設計書_v3.md"
          }
        ]
      }
    }
  }
};

/* =========================================================
   以下、描画ロジック（通常は編集不要）
   ========================================================= */

const DOC_KEYS = Object.keys(DOCS);

const docTabsEl = document.getElementById('docTabs');
const catTabsEl = document.getElementById('catTabs');
const revTabsEl = document.getElementById('revTabs');
const slidesEl = document.getElementById('slides');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

const mdCache = new Map();
let docKey = DOC_KEYS[0];
let catKey = null;
let verIndex = 0;
let renderToken = 0;
let pendingScrollId = null;

marked.setOptions({ gfm: true, breaks: false });

function currentDoc(){
  return DOCS[docKey];
}

function categoryKeys(){
  const doc = currentDoc();
  if (!doc?.hasCategory) return [];
  return Object.keys(doc.categories || {});
}

function currentVersions(){
  const doc = currentDoc();
  if (!doc) return [];
  if (doc.hasCategory){
    const cat = doc.categories?.[catKey];
    return cat?.versions || [];
  }
  return doc.versions || [];
}

function latestVersionIndex(){
  return Math.max(0, currentVersions().length - 1);
}

function clearStaleLocationHash(){
  if (pendingScrollId) return;
  if (location.hash){
    history.replaceState(null, '', location.pathname + location.search);
  }
}

function selectDoc(key){
  clearStaleLocationHash();
  docKey = key;
  const keys = categoryKeys();
  catKey = currentDoc().hasCategory ? (keys[0] || null) : null;
  verIndex = latestVersionIndex();
  render();
}

function selectCategory(key){
  clearStaleLocationHash();
  catKey = key;
  verIndex = latestVersionIndex();
  render();
}

function selectVersion(i){
  clearStaleLocationHash();
  verIndex = i;
  render();
}

function goToDocByLabel(label){
  if (DOCS[label]) selectDoc(label);
}

function findVersionIndex(doc, category, version){
  const versions = doc?.hasCategory
    ? (doc.categories?.[category]?.versions || [])
    : (doc?.versions || []);
  if (!version) return Math.max(0, versions.length - 1);
  const i = versions.findIndex(v => v.version === version);
  return i >= 0 ? i : Math.max(0, versions.length - 1);
}

function navigateToDoc(docLabel, category, version, hashId){
  const doc = DOCS[docLabel];
  if (!doc) return false;
  pendingScrollId = hashId || null;
  docKey = docLabel;
  if (doc.hasCategory){
    const keys = Object.keys(doc.categories || {});
    catKey = category && doc.categories[category] ? category : (keys[0] || null);
  } else {
    catKey = null;
  }
  verIndex = findVersionIndex(doc, catKey, version);
  render();
  return true;
}

function scrollToEl(el){
  if (!el) return false;
  // URLハッシュは残さない（リロード時に前回ジャンプ先へ飛んでしまうため）
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  return true;
}

function scrollToId(id){
  if (!id) return false;
  return scrollToEl(document.getElementById(id));
}

function decodeHash(hash){
  let raw = String(hash || '').replace(/^#/, '');
  if (!raw) return '';
  try { raw = decodeURIComponent(raw); } catch (_) {}
  return raw;
}

function findHashTarget(hash, prefix, root){
  const raw = decodeHash(hash);
  if (!raw) return null;
  const scope = root || document;
  const candidates = [raw];
  if (prefix) candidates.push(`${prefix}-${raw}`);

  for (const id of candidates){
    if (scope.querySelector){
      const el = scope.querySelector(`[id="${CSS.escape(id)}"]`);
      if (el) return el;
    }
    const global = document.getElementById(id);
    if (global) return global;
  }

  if (scope.querySelectorAll){
    for (const el of scope.querySelectorAll('[id]')){
      if (el.id === raw || el.id.endsWith(`-${raw}`)) return el;
    }
  }
  return null;
}

function resolveLocalHash(hash, prefix, root){
  const el = findHashTarget(hash, prefix, root);
  return el ? el.id : null;
}

function applyPendingScroll(prefix, root){
  // タブ切替のたびに location.hash を見ると、前回ジャンプ先（例: screen-s6）へ再度飛んでしまう。
  // 明示的な pendingScrollId（目次リンク・ディープリンク）のときだけスクロールする。
  const wanted = pendingScrollId;
  if (!wanted) return;
  const el = findHashTarget(wanted, prefix, root);
  if (el && scrollToEl(el)){
    pendingScrollId = null;
  }
}

async function loadMarkdown(path){
  if (mdCache.has(path)) return mdCache.get(path);
  const res = await fetch(path, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`${path} を読み込めませんでした（${res.status}）`);
  let text = await res.text();
  text = text.replace(
    /\[([^\]]*調査報告書[^\]]*)\]\(\)/g,
    '[$1](#doc-調査書)'
  );
  mdCache.set(path, text);
  return text;
}

function wireMarkdownLinks(root, prefix){
  root.querySelectorAll('a[href^="#"]').forEach(a => {
    const href = a.getAttribute('href') || '';

    if (href === '#doc-調査書'){
      a.addEventListener('click', (e) => {
        e.preventDefault();
        goToDocByLabel('調査書');
      });
      return;
    }

    if (href.startsWith('#nav:')){
      a.addEventListener('click', (e) => {
        e.preventDefault();
        const parts = href.slice(5).split(':');
        const docLabel = parts[0] || '';
        const category = parts[1] || null;
        const version = parts[2] || null;
        const slug = parts.slice(3).join(':');
        const fullHash = slug
          ? [docLabel, category, version, slug].filter(Boolean).join('-')
          : null;
        navigateToDoc(docLabel, category, version, fullHash);
      });
      return;
    }

    if (href.startsWith('#doc-')){
      a.addEventListener('click', (e) => {
        e.preventDefault();
        goToDocByLabel(href.slice(5));
      });
      return;
    }

    a.addEventListener('click', (e) => {
      e.preventDefault();
      const el = findHashTarget(href, prefix, root);
      if (el){
        scrollToEl(el);
        return;
      }
      // fallback: active slide only
      const active = document.querySelector('.slide.active .md-body');
      const fallback = findHashTarget(href, prefix, active);
      if (fallback) scrollToEl(fallback);
    });
  });
}

const imgLightboxEl = document.getElementById('imgLightbox');
const imgLightboxImgEl = document.getElementById('imgLightboxImg');
const imgLightboxCloseEl = document.getElementById('imgLightboxClose');

function openImageLightbox(src, alt){
  imgLightboxImgEl.src = src;
  imgLightboxImgEl.alt = alt || '';
  imgLightboxEl.hidden = false;
  imgLightboxEl.classList.add('is-open');
  imgLightboxEl.setAttribute('aria-hidden', 'false');
  document.body.classList.add('img-lightbox-open');
  imgLightboxCloseEl.focus();
}

function closeImageLightbox(){
  imgLightboxEl.classList.remove('is-open');
  imgLightboxEl.hidden = true;
  imgLightboxEl.setAttribute('aria-hidden', 'true');
  document.body.classList.remove('img-lightbox-open');
  imgLightboxImgEl.src = '';
}

imgLightboxEl.addEventListener('click', (e) => {
  if (e.target === imgLightboxEl) closeImageLightbox();
});
imgLightboxImgEl.addEventListener('click', (e) => e.stopPropagation());
imgLightboxCloseEl.addEventListener('click', closeImageLightbox);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && imgLightboxEl.classList.contains('is-open')){
    closeImageLightbox();
  }
});

function wireZoomableImages(root){
  if (!root) return;
  root.querySelectorAll('.md-body img, .section img').forEach((img) => {
    if (img.dataset.zoomable) return;
    img.dataset.zoomable = 'true';
    img.tabIndex = 0;
    img.setAttribute('role', 'button');
    const label = img.alt ? `${img.alt}を拡大表示` : '画像を拡大表示';
    img.setAttribute('aria-label', label);
    const open = () => openImageLightbox(img.currentSrc || img.src, img.alt);
    img.addEventListener('click', open);
    img.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        open();
      }
    });
  });
}

function slugifyHeading(text){
  return String(text)
    .trim()
    .toLowerCase()
    .replace(/[【】「」『』（）()［］\[\]"'`]/g, '')
    .replace(/[・、。．，,./／\\|:;!?！？]/g, '-')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '')
    || 'section';
}

function addHeadingAnchors(root, prefix){
  const used = new Map();
  root.querySelectorAll('h1, h2, h3, h4, h5').forEach((heading) => {
    if (heading.querySelector('.heading-anchor')) return;

    const label = Array.from(heading.childNodes)
      .filter(n => !(n.nodeType === 1 && n.classList?.contains('heading-anchor')))
      .map(n => n.textContent || '')
      .join('')
      .trim();

    const base = slugifyHeading(label);
    const count = used.get(base) || 0;
    used.set(base, count + 1);
    const id = count === 0 ? `${prefix}-${base}` : `${prefix}-${base}-${count + 1}`;
    heading.id = id;

    const anchor = document.createElement('a');
    anchor.className = 'heading-anchor';
    anchor.href = `#${id}`;
    anchor.setAttribute('aria-label', `「${label}」へのリンク`);
    anchor.textContent = '#';
    anchor.addEventListener('click', (e) => {
      e.preventDefault();
      heading.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    heading.prepend(anchor);
  });
}

/* Markdown内の <a id="screen-..."> を直後の見出しへ移し、ジャンプ先を安定させる */
function promoteJumpAnchors(root){
  root.querySelectorAll('a[id="features"], a[id^="screen-"], a[id^="detail-"]').forEach((a) => {
    const heading = a.nextElementSibling;
    if (!heading || !/^H[1-6]$/.test(heading.tagName)) return;
    const jumpId = a.id;
    heading.id = jumpId;
    const mark = heading.querySelector('.heading-anchor');
    if (mark) mark.setAttribute('href', `#${jumpId}`);
    a.remove();
  });
}

/* スライド1件分の中身（sections）描画 — 既存ロジックを維持 */
function renderSections(sectionEl, slide, anchorPrefix){
  (slide.sections || []).forEach(sec => {
    const wrap = document.createElement('div');
    wrap.className = 'section';

    if (sec.heading){
      const h3 = document.createElement('h3');
      h3.textContent = sec.heading;
      wrap.appendChild(h3);
    }
    if (sec.body){
      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = sec.body;
      wrap.appendChild(body);
    }
    if (sec.image){
      const img = document.createElement('img');
      img.src = sec.image;
      img.alt = sec.heading || '';
      wrap.appendChild(img);
    }
    sectionEl.appendChild(wrap);
  });
  addHeadingAnchors(sectionEl, anchorPrefix);
  wireZoomableImages(sectionEl);
}

async function fillMarkdown(container, path, token, anchorPrefix){
  const status = document.createElement('div');
  status.className = 'md-status';
  status.textContent = '読み込み中…';
  container.appendChild(status);

  try{
    const md = await loadMarkdown(path);
    if (token !== renderToken) return;
    status.remove();
    const body = document.createElement('div');
    body.className = 'md-body';
    body.innerHTML = marked.parse(md);
    container.appendChild(body);
    addHeadingAnchors(body, anchorPrefix);
    promoteJumpAnchors(body);
    wireMarkdownLinks(body, anchorPrefix);
    wireZoomableImages(body);
    const slide = container.closest('.slide');
    if (slide?.classList.contains('active')){
      applyPendingScroll(anchorPrefix, body);
    }
  } catch (err){
    if (token !== renderToken) return;
    status.classList.add('error');
    status.textContent = String(err.message || err);
  }
}

function renderSlideContent(section, slide, token, anchorPrefix){
  const meta = document.createElement('div');
  meta.className = 'slide-meta';
  const bits = [docKey];
  if (currentDoc().hasCategory && catKey) bits.push(catKey);
  bits.push(slide.version);
  if (slide.date) bits.push(slide.date);
  meta.innerHTML = bits.map(b => `<span>${b}</span>`).join('');
  section.appendChild(meta);

  const h2 = document.createElement('h2');
  h2.textContent = slide.title || '';
  section.appendChild(h2);

  if (slide.summary){
    const summary = document.createElement('div');
    summary.className = 'summary';
    summary.textContent = slide.summary;
    section.appendChild(summary);
  }

  if (slide.markdown){
    fillMarkdown(section, slide.markdown, token, anchorPrefix);
  } else {
    renderSections(section, slide, anchorPrefix);
  }
}

function persistNav(){
  try{
    sessionStorage.setItem('ar-docs-nav', JSON.stringify({ docKey, catKey, verIndex }));
  } catch (_){}
}

function restoreNav(){
  try{
    const raw = sessionStorage.getItem('ar-docs-nav');
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (!saved?.docKey || !DOCS[saved.docKey]) return false;
    docKey = saved.docKey;
    const doc = DOCS[docKey];
    if (doc.hasCategory){
      const keys = Object.keys(doc.categories || {});
      catKey = saved.catKey && doc.categories?.[saved.catKey] ? saved.catKey : (keys[0] || null);
    } else {
      catKey = null;
    }
    const versions = currentVersions();
    verIndex = Number.isInteger(saved.verIndex) && saved.verIndex >= 0 && saved.verIndex < versions.length
      ? saved.verIndex
      : latestVersionIndex();
    return true;
  } catch (_){
    return false;
  }
}

function render(){
  if (imgLightboxEl.classList.contains('is-open')) closeImageLightbox();
  const token = ++renderToken;
  const doc = currentDoc();
  const versions = currentVersions();
  if (verIndex >= versions.length) verIndex = latestVersionIndex();
  persistNav();

  // --- 1階層目: 大分類 ---
  docTabsEl.innerHTML = '';
  DOC_KEYS.forEach((key) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = key;
    if (key === docKey) btn.classList.add('active');
    btn.setAttribute('aria-current', key === docKey ? 'page' : 'false');
    btn.addEventListener('click', () => selectDoc(key));
    docTabsEl.appendChild(btn);
  });

  // --- 2階層目: 種別（hasCategory のときだけ） ---
  catTabsEl.innerHTML = '';
  if (doc.hasCategory){
    catTabsEl.classList.add('is-visible');
    categoryKeys().forEach((key) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = key;
      if (key === catKey) btn.classList.add('active');
      btn.addEventListener('click', () => selectCategory(key));
      catTabsEl.appendChild(btn);
    });
  } else {
    catTabsEl.classList.remove('is-visible');
  }

  // --- 3階層目: バージョン ---
  revTabsEl.innerHTML = '';
  slidesEl.innerHTML = '';

  versions.forEach((slide, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = slide.version;
    if (i === versions.length - 1) btn.classList.add('latest');
    if (i === verIndex) btn.classList.add('active');
    btn.addEventListener('click', () => selectVersion(i));
    revTabsEl.appendChild(btn);

    const section = document.createElement('section');
    section.className = 'slide' + (i === verIndex ? ' active' : '');
    const prefix = [docKey, catKey, slide.version].filter(Boolean).join('-');
    renderSlideContent(section, slide, token, prefix);
    slidesEl.appendChild(section);
  });

  prevBtn.disabled = verIndex === 0 || versions.length === 0;
  nextBtn.disabled = verIndex >= versions.length - 1;
}

prevBtn.addEventListener('click', () => {
  if (verIndex > 0){ verIndex--; render(); }
});
nextBtn.addEventListener('click', () => {
  if (verIndex < currentVersions().length - 1){ verIndex++; render(); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' && verIndex > 0){ verIndex--; render(); }
  if (e.key === 'ArrowRight' && verIndex < currentVersions().length - 1){ verIndex++; render(); }
});

// 初期表示: ハッシュによる自動ジャンプはしない。前回タブだけ復元する
(function bootstrap(){
  if (location.hash){
    history.replaceState(null, '', location.pathname + location.search);
  }
  pendingScrollId = null;
  if (restoreNav()){
    render();
  } else {
    selectDoc(DOC_KEYS[0]);
  }
})();
</script>
